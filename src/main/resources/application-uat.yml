server:
  port: 8080
  netty:
    connection-timeout: 3s
    idle-timeout: 20s

jasper:
  cache-enabled: true
  generation-timeout: 45s

logging:
  level:
    root: INFO
    com.example.jasper: DEBUG
    reactor.netty: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,env,loggers
  endpoint:
    health:
      show-details: always